name: Commercial schema88 focused compatibility
on:
  pull_request:
    paths:
      - 'tools/asier_compat62/**'
      - 'tests/unit62/**'
      - '.github/workflows/asier-commercial62.yml'
permissions:
  contents: read
env:
  CI: 'true'
jobs:
  commercial88:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.119.0
      - name: Real disposable 87 to 88 compatibility, no hosted configuration
        run: node --experimental-transform-types tools/asier_compat62/run.mjs
      - name: Preserve safe results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commercial62-safe-evidence
          path: ${{ runner.temp }}/unit62.safe.json
          retention-days: 7
