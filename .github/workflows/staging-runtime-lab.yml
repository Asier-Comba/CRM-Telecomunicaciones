name: Staging runtime image lab
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'infra/deployment/Dockerfile'
      - 'scripts/platform/**'
      - 'tools/asier_staging_channel/**'
      - '.github/workflows/staging-runtime-lab.yml'
permissions:
  contents: read
jobs:
  runtime-lab:
    if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, format('RUNTIME_LAB_SHA={0}', github.event.pull_request.head.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: node --experimental-transform-types tools/asier_staging_channel/runtime-lab.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-runtime-lab-safe
          path: ${{ runner.temp }}/staging-runtime-lab.safe.json
          retention-days: 7
