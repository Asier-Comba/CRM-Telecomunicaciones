name: Supabase local acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/supabase-local.yml'
      - 'scripts/security/supabase-local/**'
      - 'supabase/config.toml'
      - 'src/lib/server/product-*.ts'
      - 'src/app/api/product/**'
      - 'src/app/api/billing/**'
      - 'src/app/api/team/**'
      - 'src/app/api/portfolio/**'
      - 'src/app/api/import/**'
      - 'src/app/api/inbox/**'
      - 'src/lib/server/inbox-*.ts'
      - 'src/lib/server/importjob-*.ts'
      - 'src/app/api/document/**'
      - 'src/lib/server/document-*.ts'
      - 'src/lib/server/portfolio-*.ts'
      - 'src/lib/server/team-*.ts'
      - 'src/lib/server/billing-*.ts'
      - 'src/features/product/integration/**'
      - 'src/features/customers/**'
      - 'src/features/calendar/**'
      - 'src/features/dashboard/**'
      - 'src/features/billing/**'
      - 'src/features/documents/**'
      - 'src/features/opportunities/**'
      - 'src/features/portfolio/**'
      - 'src/features/settings/**'
      - 'src/features/inbox/**'
      - 'src/components/Sidebar.tsx'
      - 'src/components/Topbar.tsx'
      - 'src/app/(saas)/clients/**'
      - 'supabase/migrations/**'
permissions:
  contents: read
env:
  CI: 'true'
concurrency:
  group: supabase-local-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-secret-boundary:
    name: Browser bundle private-value boundary
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Build with private test canaries and scan actual client assets
        run: node scripts/security/supabase-local/browser-secret-check.mjs
  local-platform:
    name: Supabase local Auth PostgREST Storage acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install and build application transport
        run: |
          npm ci
          npm run build
      - name: Pinned official CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - name: Install Chromium for actual product UI journeys
        run: npx playwright install --with-deps chromium
      - name: Install PDF renderer for authorized invoice output
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Disposable real-local stack and acceptance
        env:
          W2_PRODUCT_UI: 'true'
        run: node scripts/security/supabase-local/run-stack.mjs
      - name: Retain safe summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supabase-local-safe-evidence
          path: ${{ runner.temp }}/w4-supabase-safe-evidence.json
          retention-days: 7
      - name: Retain synthetic product UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w2-product-ui-synthetic-screenshots
          path: ${{ runner.temp }}/w2-product-ui
          retention-days: 7
