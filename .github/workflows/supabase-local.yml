permissions:
  contents: read
env:
  CI: 'true'
concurrency:
  group: supabase-local-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-secret-boundary:
    name: Browser bundle private-value boundary
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Build with private test canaries and scan actual client assets
        run: node scripts/security/supabase-local/browser-secret-check.mjs
  local-platform:
    name: Supabase local Auth PostgREST Storage acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install and build application transport
        run: |
          npm ci
          npm run build
      - name: Pinned official CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      # Run 39765853702 (f9aa) was cancelled at the job limit after the runner's
      # Ubuntu mirror delivered OS packages at ~75 kB/s (6.5 min) while the
      # acceptance itself was within its usual time. The same packages are now
      # served from a first-party cache, apt fails over instead of trickling,
      # and preparation has its own bound so it cannot consume test time.
      - name: Restore cached OS packages (Chromium dependencies, PDF renderer)
        id: os-debs
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/apt-archives
          key: os-debs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-poppler-v1
      - name: Install Chromium and PDF renderer for actual product UI journeys
        timeout-minutes: 6
        run: |
          set -euo pipefail
          mkdir -p "$HOME/apt-archives/partial"
          printf 'Dir::Cache::Archives "%s/apt-archives";\nAPT::Keep-Downloaded-Packages "true";\nAcquire::Retries "3";\nAcquire::http::Timeout "20";\n' "$HOME" | sudo tee /etc/apt/apt.conf.d/99ci-os-debs >/dev/null
          npx playwright install --with-deps chromium
          # Package indexes were refreshed by install-deps just above.
          sudo apt-get install -y poppler-utils
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
          echo "cached .deb files: $(find "$HOME/apt-archives" -maxdepth 1 -name '*.deb' | wc -l)"
      - name: Save OS packages for the next run
        if: steps.os-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/apt-archives
          key: os-debs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-poppler-v1
      - name: Disposable real-local stack and acceptance
        env:
          W2_PRODUCT_UI: 'true'
        # Match test:assistant: the unchanged ConversationServiceV2 uses a
        # TypeScript parameter property, which strip-only Node cannot import.
        run: node --experimental-transform-types scripts/security/supabase-local/run-stack.mjs
      - name: Retain safe summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supabase-local-safe-evidence
          path: ${{ runner.temp }}/w4-supabase-safe-evidence.json
          retention-days: 7
      - name: Retain synthetic product UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w2-product-ui-synthetic-screenshots
          path: ${{ runner.temp }}/w2-product-ui
          retention-days: 7
      - name: Retain synthetic history UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w3-history-ui-synthetic-screenshots
          path: ${{ runner.temp }}/w3-history-ui
          retention-days: 7
