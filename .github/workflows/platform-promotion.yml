name: W5 protected promotion preflight
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [STAGING, PROD]
        required: true
      candidate_path:
        type: string
        required: true
        description: Repository path to reviewed candidate JSON (no secrets)
permissions:
  contents: read
concurrency:
  group: crm-promotion-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target == 'PROD' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version-file: .nvmrc}
      - name: Validate immutable exact candidate; no deployment or provider effects
        env:
          CANDIDATE_PATH: ${{ inputs.candidate_path }}
          PROMOTION_TARGET: ${{ inputs.target }}
        run: node scripts/platform/promotion.mjs "$CANDIDATE_PATH" "$PROMOTION_TARGET"
