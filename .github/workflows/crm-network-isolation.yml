name: CRM disposable network isolation
on:
  pull_request:
    paths:
      - 'scripts/deployment/network-*.mjs'
      - 'tests/bootstrap/network-isolation.test.mjs'
      - '.github/workflows/crm-network-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crm-network-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      PLATFORM_TARGET: LOCAL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Policy negatives and real local CONNECT transport
        run: node --test tests/bootstrap/network-isolation.test.mjs
      - name: Actual isolated Swarm networks and TLS egress on an empty ephemeral runner
        run: node scripts/deployment/network-acceptance.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: network-isolation-safe
          path: network-isolation.safe.json
          if-no-files-found: error
          retention-days: 7
