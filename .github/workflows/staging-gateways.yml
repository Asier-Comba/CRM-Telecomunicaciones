name: Staging private gateway contracts
on:
  pull_request:
    paths:
      - 'tools/asier_staging_network/**'
      - '.github/workflows/staging-gateways.yml'
permissions:
  contents: read
jobs:
  gateway-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: node --experimental-transform-types --test tools/asier_staging_network/*.test.mjs
