name: W5 native profile88 compatibility (Storage proposal)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/platform/durable-native-fixture.mjs'
      - 'scripts/security/native-postgres/**'
      - 'src/assistant/durable-*.ts'
      - 'supabase/migrations/**'
      - 'tests/fixtures/native-provider-rpc-grants-delivered.json'
      - 'tests/bootstrap/owned-consumer-migration-*.test.mjs'
      - '.github/workflows/w5-native-profile-88.yml'
permissions:
  contents: read
concurrency:
  group: w5-native-profile-88-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile88:
    name: W5 exact profile88 closure and independent committed restart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      TELECOM_NATIVE_RESOURCE_DISPOSABLE: 'true'
      # Full proposed set: exactly the 87 pinned blobs plus Storage forward 88.
      TELECOM_NATIVE_CONSUMER_MIGRATION_CLOSURE: require_profile_88
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONTEXT: ''
      NODE_ENV: test
      APP_ENV: test
      ALLOW_PRODUCTION_TESTS: 'false'
    steps:
      - name: Exact consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Existing Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Existing application dependencies
        run: npm ci
      - name: Exact 85/86 and 87 closures still strict and profile88 exact
        run: |
          node --test tests/bootstrap/owned-consumer-migration-closure.test.mjs tests/bootstrap/owned-consumer-migration-profile87.test.mjs tests/bootstrap/owned-consumer-migration-profile88.test.mjs
      - name: Physical profile88 migration, committed restart and teardown
        run: node --experimental-transform-types scripts/security/native-postgres/consume-owned-resource-committed-restart-v1.mjs
