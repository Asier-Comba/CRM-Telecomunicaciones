name: Historical literal scanner synthetic Linux qualification
on:
  pull_request:
    paths:
      - '.github/workflows/historical-literal-contracts.yml'
permissions:
  contents: read
jobs:
  synthetic-linux:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REVIEWED_SCANNER_SOURCE: ff2d4f4ca80820b22a1a846de85dfd444b110aad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require the unchanged W4 source closure, except this qualification workflow
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code "$REVIEWED_SCANNER_SOURCE" HEAD -- . ':(exclude).github/workflows/historical-literal-contracts.yml'
          git diff --exit-code
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Verify exact scanner and immediate dependency bytes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const pins = {
            'scan-historical-literals.mjs': '828cfcbe4394a393c7499974ba4f0d63073bef73d6b43cb9c95b6de8aa9239a2',
            'scan-historical-literals.test.mjs': 'fc82b2a497778c8ad6bacadbe29ca08deea604531f6bb1e9b4bfc7fc76d4afb6',
            'oci-evidence.mjs': '70deb2c42448f3503ae6dd0122801cf70a6e3ec0e539c093fb97b7a5315bf8ba',
            'contract.mjs': 'a7d266689f8e45a7699b2aad13ea2a1247cc7fafc3e58e555763155c3910abc0'
          };
          for (const [name, expected] of Object.entries(pins)) {
            const actual = createHash('sha256').update(readFileSync('tools/asier_staging_channel/' + name)).digest('hex');
            if (actual !== expected) throw Error('SCANNER_SOURCE_BYTES_MISMATCH');
          }
          console.log('EXACT_W4_SCANNER_BYTES_CHECKED; source provenance and image acceptance not inferred');
          NODE
      - name: Existing twenty synthetic tests only, without installation or real history transport
        shell: bash
        run: |
          node --experimental-transform-types --test --test-reporter=tap tools/asier_staging_channel/scan-historical-literals.test.mjs > "$RUNNER_TEMP/historical-literals.synthetic.tap"
      - name: Require twenty passes, zero failures, cancellations and skips
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const lines = readFileSync(join(process.env.RUNNER_TEMP, 'historical-literals.synthetic.tap'), 'utf8').split(/\r?\n/);
          for (const [name, expected] of Object.entries({tests:20,pass:20,fail:0,cancelled:0,skipped:0})) {
            const matches = lines.filter(line => line.startsWith('# ' + name + ' '));
            if (matches.length !== 1 || matches[0] !== '# ' + name + ' ' + expected) throw Error('SYNTHETIC_LINUX_COVERAGE_INCOMPLETE');
          }
          console.log('20_SYNTHETIC_LINUX_TESTS_PASS; REAL_TEN_FINDINGS_NOT_CLASSIFIED; IMAGE_PRIVATE_VERIFIED=false; STAGING_DEPLOYED=false');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: historical-literals-synthetic-linux
          path: ${{ runner.temp }}/historical-literals.synthetic.tap
          retention-days: 14
          if-no-files-found: error
