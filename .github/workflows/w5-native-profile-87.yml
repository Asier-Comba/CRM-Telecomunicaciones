name: W5 native profile87 compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/platform/durable-native-fixture.mjs'
      - 'scripts/security/native-postgres/**'
      - 'src/assistant/durable-*.ts'
      - 'supabase/migrations/**'
      - 'tests/fixtures/native-provider-rpc-grants-delivered.json'
      - 'tests/bootstrap/owned-consumer-migration-*.test.mjs'
      - '.github/workflows/w5-native-profile-87.yml'
permissions:
  contents: read
concurrency:
  group: w5-native-profile-87-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile87:
    name: Exact ${{ matrix.mode }} closure and independent committed restart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [historical_profile_87_from_d1, require_base87_plus_d1]
    env:
      CI: 'true'
      TELECOM_NATIVE_RESOURCE_DISPOSABLE: 'true'
      TELECOM_NATIVE_CONSUMER_MIGRATION_CLOSURE: ${{ matrix.mode }}
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONTEXT: ''
      NODE_ENV: test
      APP_ENV: test
      ALLOW_PRODUCTION_TESTS: 'false'
    steps:
      - name: Exact consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Existing Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Existing application dependencies
        run: npm ci
      - name: Exact 85/86 closures still strict and profile87 exact
        run: |
          node --test tests/bootstrap/owned-consumer-migration-closure.test.mjs tests/bootstrap/owned-consumer-migration-profile87.test.mjs tests/bootstrap/owned-consumer-migration-d1.test.mjs
      - name: Physical explicitly selected migration profile, committed restart and teardown
        run: node --experimental-transform-types scripts/security/native-postgres/consume-owned-resource-committed-restart-v1.mjs
