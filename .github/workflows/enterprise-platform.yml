name: W5 enterprise platform acceptance
on:
  pull_request:
    paths:
      - 'scripts/platform/**'
      - 'tests/platform/**'
      - 'infra/**'
      - 'supabase/**'
      - 'scripts/security/supabase-local/**'
      - '.github/workflows/enterprise-platform.yml'
      - 'next.config.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w5-enterprise-${{ github.ref }}
  cancel-in-progress: true
jobs:
  n8n-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: {CI: 'true', PLATFORM_TARGET: LOCAL}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version-file: .nvmrc}
      - name: Actual pinned isolated n8n/PostgreSQL readiness/import/export/process and DB restart
        run: node scripts/platform/n8n-local-acceptance.mjs
      - name: Install exact checksum-verified scanner for both vendor images
        if: always()
        run: |
          curl --fail --location --silent --show-error https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/n8n-scanner"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/n8n-scanner" trivy
          echo "$RUNNER_TEMP/n8n-scanner" >> "$GITHUB_PATH"
      - name: Retain independent vendor-image security gate even when native acceptance fails
        if: always()
        run: node scripts/platform/image-scan.mjs n8n
      - name: Independent pinned PostgreSQL image security gate
        if: always()
        run: node scripts/platform/image-scan.mjs postgres
  proxy-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version-file: .nvmrc}
      - name: Actual Compose parser, no containers or provider effects
        run: node scripts/platform/compose-contract.mjs
      - name: Install disposable system proxy validator; no deployment image is selected
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nginx openssl
      - name: Actual synthetic TLS proxy, private headers, SSE and Upgrade acceptance
        run: node scripts/platform/proxy-acceptance.mjs
  auth-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {CI: 'true', PLATFORM_TARGET: LOCAL}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version-file: .nvmrc}
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with: {version: 2.119.0}
      - run: npm ci
      - name: Actual local Auth SMTP and Mailpit capture; safe evidence only
        run: node scripts/platform/auth-mail-acceptance.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: w5-auth-mail-safe-evidence
          path: ${{ runner.temp }}/w5-auth-mail-safe-evidence.json
          retention-days: 7
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version-file: .nvmrc}
      - run: npm ci
      - run: node scripts/platform/inventory.mjs --check
      - run: node scripts/platform/supply-chain.mjs --check
      - run: node --test tests/platform/*.test.mjs
      - run: node scripts/platform/boundary.mjs
      - name: Private canaries in all generated build assets and logs
        run: node scripts/platform/boundary.mjs --build
      - name: Install Chromium for synthetic screenshot boundary
        run: npx playwright install --with-deps chromium
      - name: Actual build health and fail-closed missing backend
        env: {W5_BROWSER_BOUNDARY: 'true'}
        run: node scripts/platform/smoke.mjs
      - name: Retain only synthetic screenshot for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w5-synthetic-secret-boundary-login
          path: ${{ runner.temp }}/w5-synthetic-browser
          retention-days: 7
  container-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: {CI: 'true'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version-file: .nvmrc}
      - name: Verify official runtime base signature with exact checksum-verified Cosign
        run: |
          curl --fail --location --silent --show-error https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 -o "$RUNNER_TEMP/cosign"
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  $RUNNER_TEMP/cosign" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/cosign"
          "$RUNNER_TEMP/cosign" verify gcr.io/distroless/nodejs24-debian13@sha256:9eeb7f5887d0e239e78264b06f7f11d2e14be534050481803a9e4728fcdd278e --certificate-oidc-issuer https://accounts.google.com --certificate-identity keyless@distroless.iam.gserviceaccount.com
      - name: Build and start the actual nonroot read-only image; no registry push
        run: node scripts/platform/container-smoke.mjs
      - name: Install exact checksum-verified image scanner
        run: |
          curl --fail --location --silent --show-error https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/w5-scanner"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/w5-scanner" trivy
          echo "$RUNNER_TEMP/w5-scanner" >> "$GITHUB_PATH"
      - name: Fail on image high/critical vulnerabilities or secret findings
        run: node scripts/platform/image-scan.mjs
  reconstruction-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      PLATFORM_TARGET: LOCAL
      W5_RECOVERY: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version-file: .nvmrc}
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with: {version: 2.119.0}
      - run: npm ci
      - run: npm run build
      - name: Real synthetic A to empty B, authenticated DB and Storage recovery
        run: node scripts/security/supabase-local/run-stack.mjs
      - name: Safe evidence only; no archives, keys, rows or objects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w5-enterprise-local-safe-evidence
          path: ${{ runner.temp }}/w4-supabase-safe-evidence.json
          retention-days: 7
