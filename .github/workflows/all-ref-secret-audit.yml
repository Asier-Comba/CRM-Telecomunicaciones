name: W4 all-ref secret audit
on:
  pull_request:
    paths:
      - 'scripts/ci/scan-all-ref-secrets.mjs'
      - 'tests/security/all-ref-secret-scan.test.mjs'
      - '.github/workflows/all-ref-secret-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w4-all-ref-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reachable-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Refresh every advertised branch and tag
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set +x
          auth_header="$(printf 'x-access-token:%s' "$GH_READ_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          unset auth_header GH_READ_TOKEN
      - name: Install checksum pinned scanner
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o "$RUNNER_TEMP/scanner.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/scanner.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/w4-scanner"
          tar -xzf "$RUNNER_TEMP/scanner.tar.gz" -C "$RUNNER_TEMP/w4-scanner" gitleaks
          echo "$RUNNER_TEMP/w4-scanner" >> "$GITHUB_PATH"
      - name: Positive and adversarial scanner controls
        run: node --test tests/security/all-ref-secret-scan.test.mjs
      - name: Scan all reachable history without inherited suppressions
        env:
          W4_SAFE_REPORT: ${{ runner.temp }}/w4-all-ref-safe.json
        run: node scripts/ci/scan-all-ref-secrets.mjs
      - name: Retain metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w4-all-ref-safe-metadata
          path: ${{ runner.temp }}/w4-all-ref-safe.json
          retention-days: 7
