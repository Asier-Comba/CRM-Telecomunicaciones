# W5 Cloud: reproducible build for the private staging preview on Netlify.
# Values (Supabase URL/key, admission flags, cohort) live only in the Netlify
# site environment, never here. Deploys go through
# .github/workflows/w5-netlify-staging-deploy.yml from a reviewed SHA.
# Node comes from .nvmrc; the Next.js runtime is required for SSR/API routes.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Staging preview is private and must never be indexed or cached by shared caches.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
