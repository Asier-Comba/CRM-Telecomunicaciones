# Local development only. Remote Auth, SMTP, OAuth, Storage and network settings
# must be inventoried and approved separately for each environment.
project_id = "crm-telecom-local"

[api]
enabled = true
max_rows = 100

[db]
major_version = 15

[db.seed]
# Synthetic fixtures require an explicit disposable test marker and a dedicated
# fixture runner. They are never run automatically by `supabase db reset`.
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.buckets.telecom-documents]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf", "image/png", "image/jpeg"]

[storage.buckets.telecom-import-quarantine]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/zip"]
